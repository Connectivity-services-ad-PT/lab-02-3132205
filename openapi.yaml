openapi: 3.1.0
info:
  title: Smart Campus — Core Business & Access Control Platform
  description: |
    Hợp đồng API chuẩn hóa phục vụ việc giao tiếp thời gian thực giữa 
    thiết bị Kiểm soát ra vào (Access Gate - Consumer) và Hệ thống nghiệp vụ trung tâm 
    (Core Business Service - Provider) thuộc phân khu Smart Campus.
  version: 1.0.0

servers:
  - url: http://localhost:4010
    description: Prism Mock Server dành cho môi trường phát triển cục bộ

paths:
  /access/check:
    post:
      operationId: checkAccessPermission
      summary: Thẩm định quyền ra vào thời gian thực
      description: |
        Được gọi bởi Access Gate (Consumer) ngay khi có sự kiện sinh viên hoặc cán bộ quẹt thẻ vật lý. 
        Hệ thống trung tâm (Provider) sẽ tính toán tập luật và đưa ra quyết định đóng/mở cửa tức thời.
      tags:
        - Access Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCheckRequest'
      responses:
        '200':
          description: Thẩm định thành công (Quyết định có thể là ALLOW hoặc DENIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /policies/access/{policyId}:
    get:
      operationId: getAccessPolicyById
      summary: Lấy chi tiết thông tin chính sách an ninh
      description: Được gọi khi Access Gate cần đồng bộ hoặc kiểm tra chi tiết cấu hình luật phân quyền cụ thể từ Core trung tâm.
      tags:
        - Policy Management
      parameters:
        - name: policyId
          in: path
          required: true
          description: Mã định danh duy nhất của chính sách an ninh cần truy vấn
          schema:
            type: string
            pattern: '^POL-[0-9]{4}$'
            example: 'POL-1024'
      responses:
        '200':
          description: Tìm thấy thông tin chính sách thành công
          headers:
            Deprecation:
              description: Cảnh báo endpoint này sắp bị thay thế trong tương lai
              schema:
                type: string
                example: "true"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decisions:
    get:
      operationId: listAccessDecisions
      summary: Lấy danh sách lịch sử quyết định ra vào
      description: Phục vụ mục đích giám sát, cho phép lấy danh sách lịch sử quẹt thẻ phân trang theo cơ chế con trỏ (Cursor).
      tags:
        - Audit Logs
      parameters:
        - name: limit
          in: query
          required: false
          description: Số lượng bản ghi tối đa trả về trên một trang
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: starting_after
          in: query
          required: false
          description: Con trỏ (ID của quyết định) dùng để lấy trang tiếp theo
          schema:
            type: string
            pattern: '^DEC-[a-fA-F0-9]{8}$'
      responses:
        '200':
          description: Trả về danh sách quyết định kèm thông tin phân trang con trỏ
          content:
            application/json:
              schema:
                type: object
                required: [data, hasMore, nextCursor]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DecisionLog'
                  hasMore:
                    type: boolean
                    description: Đánh dấu xem còn trang tiếp theo để tải hay không
                  nextCursor:
                    type: [string, "null"]
                    description: Giá trị ID dùng làm tham số starting_after cho request tiếp theo
                    example: 'DEC-a1b2c3d4'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decisions/{decisionId}:
    get:
      operationId: getAccessDecisionById
      summary: Tra cứu chi tiết một bản ghi quyết định ra vào
      description: Phục vụ mục đích đối chiếu dữ liệu hoặc xử lý sự cố kẹt cổng cơ học khi có tranh chấp khẩn cấp.
      tags:
        - Audit Logs
      parameters:
        - name: decisionId
          in: path
          required: true
          description: Mã định danh của bản ghi quyết định cần đối chiếu
          schema:
            type: string
            pattern: '^DEC-[a-fA-F0-9]{8}$'
            example: 'DEC-e7d7d4f1'
      responses:
        '200':
          description: Tìm thấy dữ liệu log quyết định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      operationId: getSystemHealth
      summary: Kiểm tra trạng thái sức khỏe hệ thống (Heartbeat)
      description: Được gọi định kỳ bởi Access Gate để giám sát kết nối trực tuyến kết nối đến Core Business.
      tags:
        - System Utilities
      responses:
        '200':
          description: Hệ thống hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '503':
          description: Hệ thống Core Business đang quá tải hoặc gặp sự cố downstream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

webhooks:
  onSecurityAlert:
    post:
      summary: Webhook thông báo sự kiện khẩn cấp
      description: Phát tín hiệu tự động từ Core Business về thiết bị Access Gate khi có cấu hình danh sách đen mới hoặc lệnh phong tỏa khu vực khẩn cấp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alertId, type, zoneId, timestamp]
              additionalProperties: false
              properties:
                alertId:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum: [LOCKDOWN, BLACKLIST_UPDATE]
                zoneId:
                  type: string
                  example: "ZONE-BLOCK-A"
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Khách nhận và xử lý tín hiệu webhook thành công

components:
  securitySchemes:
    GateApiKey:
      type: apiKey
      in: header
      name: X-Gate-API-Key
      description: Mã khóa bí mật được nhúng cố định dưới phần cứng của Access Gate dùng để định danh thiết bị.

  schemas:
    AccessCheckRequest:
      type: object
      required: [requestId, cardId, gateId, timestamp]
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
          description: Mã định danh chống trùng lặp gói tin thời gian thực
        cardId:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: Chuỗi mã thẻ sinh viên/bảo vệ đã được băm SHA-256 từ phần cứng
          example: '473a218d8e5b412ea0c01a6134b7f5c7'
        gateId:
          type: string
          minLength: 5
          maxLength: 30
          description: Mã định danh cổng vật lý thực hiện quẹt thẻ
          example: 'GATE-BLOCK-A-01'
        timestamp:
          type: string
          format: date-time
          description: Mốc thời gian sinh viên tiến hành quẹt thẻ thực tế

    AccessCheckResponse:
      type: object
      required: [requestId, allow, reasonCode, timestamp]
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        allow:
          type: boolean
          description: Quyết định mở cửa (true) hoặc khóa cửa (false)
        reasonCode:
          type: string
          enum: [SUCCESS, BLACKLISTED_CARD, EXPIRED_POLICY, OUT_OF_SCHEDULE, INVALID_ZONE, TIMESTAMP_SKEW]
          description: Mã định danh lý do nghiệp vụ viết hoa phục vụ bóc tách tự động
        policyId:
          type: [string, "null"]
          pattern: '^POL-[0-9]{4}$'
          description: Mã chính sách được áp dụng để đưa ra quyết định thẩm định
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Thời hạn thẻ phải ra khỏi khu vực (áp dụng cho thẻ khách tạm thời)
        timestamp:
          type: string
          format: date-time

    AccessPolicy:
      type: object
      required: [policyId, policyName, status, zoneId, policyType]
      additionalProperties: false
      discriminator:
        propertyName: policyType
        mapping:
          SCHEDULED: '#/components/schemas/ScheduledPolicy'
          RESTRICTED: '#/components/schemas/RestrictedPolicy'
      properties:
        policyId:
          type: string
          pattern: '^POL-[0-9]{4}$'
        policyName:
          type: string
          minLength: 3
          maxLength: 100
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        zoneId:
          type: string
          example: 'ZONE-BLOCK-A'
        policyType:
          type: string
          enum: [SCHEDULED, RESTRICTED]

    ScheduledPolicy:
      allOf:
        - $ref: '#/components/schemas/AccessPolicy'
        - type: object
          required: [timeSlots]
          properties:
            timeSlots:
              type: array
              items:
                type: string
                example: "08:00-11:30"

    RestrictedPolicy:
      allOf:
        - $ref: '#/components/schemas/AccessPolicy'
        - type: object
          required: [allowedRoles, securityLevel]
          properties:
            allowedRoles:
              type: array
              items:
                type: string
                enum: [LECTURER, SECURITY_GUARD, ADMIN]
            securityLevel:
              type: integer
              minimum: 1
              maximum: 5

    DecisionLog:
      type: object
      required: [decisionId, requestId, cardId, gateId, result, timestamp]
      additionalProperties: false
      properties:
        decisionId:
          type: string
          pattern: '^DEC-[a-fA-F0-9]{8}$'
          example: 'DEC-e7d7d4f1'
        requestId:
          type: string
          format: uuid
        cardId:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
        gateId:
          type: string
          example: 'GATE-BLOCK-A-01'
        result:
          type: string
          enum: [ALLOWED, DENIED]
        operatorNote:
          type: [string, "null"]
          maxLength: 255
          example: 'Xử lý quẹt thẻ ghi nhận ngoại lệ từ hệ thống'
        timestamp:
          type: string
          format: date-time

    SystemHealth:
      type: object
      required: [status, timestamp]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        timestamp:
          type: string
          format: date-time

    Problem:
      type: object
      required: [type, title, status, detail, instance]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: Đường dẫn URI trỏ tới tài liệu mô tả mã lỗi cụ thể
          example: 'https://api.smartcampus.edu.vn/probs/business-rule-violation'
        title:
          type: string
          description: Mô tả ngắn gọn về loại lỗi bằng tiếng Anh
          example: 'Unprocessable Entity'
        status:
          type: integer
          description: HTTP status code tương ứng
          example: 422
        detail:
          type: string
          description: Giải thích chi tiết nguyên nhân lỗi xảy ra trong tình huống thực tế
          example: 'Timestamp skew is too large. Please synchronize the gate system clock via NTP.'
        instance:
          type: string
          description: Đường dẫn endpoint trực tiếp gây ra lỗi
          example: '/access/check'

  responses:
    BadRequest:
      description: Dữ liệu Payload gửi lên sai cấu trúc hoặc không khớp định dạng JSON Schema
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Thiết bị thiếu hoặc gửi sai mã khóa bảo mật bí mật X-Gate-API-Key ở Header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Thiết bị hợp lệ nhưng không được cấp quyền đọc phân khu tài nguyên này
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Tài nguyên mã chính sách hoặc mã lịch sử quyết định truy vấn không tồn tại
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Dữ liệu đúng cấu trúc Schema nhưng vi phạm quy tắc logic nghiệp vụ (lệch giờ hệ thống)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Hệ thống máy chủ Core Business trung tâm gặp sự cố kỹ thuật hoặc quá tải cục bộ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'