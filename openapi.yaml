openapi: 3.1.0
info:
  title: Smart Campus — AI Vision Service Contract (Group A4 - Pair 01)
  version: 1.0.0
  description: |
    Hợp đồng API chính thức giữa Camera Stream (Consumer - A2) và AI Vision (Provider - A4).
    Đảm nhận tiếp nhận luồng dữ liệu hình ảnh đồng bộ (REST sync) để phân tích đối tượng khẩn cấp.
  contact:
    name: AI Vision Team - Group A4
    email: a4-aivision@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server phục vụ Lab 02
  - url: https://api.campus.local
    description: Class network placeholder
tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: vision
    description: Các nghiệp vụ phân tích và xử lý hình ảnh thông minh
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra dịch vụ AI Vision còn hoạt động tốt hay không.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service đang hoạt động ổn định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: ai-vision-service
                    time: '2026-05-27T08:00:00Z'

  /vision/models/info:
    get:
      operationId: getModelInfo
      summary: Lấy thông tin phiên bản mô hình AI
      description: Kiểm tra thông tin cấu hình và phiên bản của mô hình AI Core hiện tại.
      tags: [vision]
      responses:
        '200':
          description: Trả về thông tin mô hình thành công
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [modelName, version]
                properties:
                  modelName:
                    type: string
                    example: "YOLOv8-Security-Custom"
                  version:
                    type: string
                    example: "v2.4.1"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vision/detect:
    post:
      operationId: detectFrame
      summary: Tiếp nhận frame hình ảnh để phân tích
      description: Nhận dữ liệu ảnh mã hóa Base64 đồng bộ từ Camera Stream gửi qua khi phát hiện chuyển động.
      tags: [vision]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectRequest'
            examples:
              motionDetected:
                value:
                  cameraId: "CAM-LOBBY-01"
                  correlationId: "corr-123456789"
                  timestamp: "2026-05-27T08:15:00Z"
                  frameData: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
      responses:
        '200':
          description: Phân tích thành công và trả về kết quả định danh đối tượng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectResponse'
              examples:
                humanDetected:
                  value:
                    detectionId: "0196fb3d-4ad7-7d1e-9f49-5d5148d2babc"
                    riskLevel: "HIGH"
                    objects:
                      - objectType: "HUMAN"
                        confidence: 0.98
                        actionDetected: "Intruding"
                vehicleDetected:
                  value:
                    detectionId: "0196fb3d-4ad7-7d1e-9f49-5d5148d2babd"
                    riskLevel: "LOW"
                    objects:
                      - objectType: "VEHICLE"
                        confidence: 0.92
                        licensePlate: "30A-12345"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vision/detections/{detectionId}:
    get:
      operationId: getDetectionById
      summary: Truy vấn chi tiết một kết quả nhận diện
      description: Cho phép tra cứu lại lịch sử phân tích của một frame bất kỳ dựa trên UUID duy nhất.
      tags: [vision]
      parameters:
        - name: detectionId
          in: path
          required: true
          description: UUID định danh duy nhất của kết quả phân tích hình ảnh.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tìm thấy kết quả chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Dữ liệu đầu vào sai định dạng cấu trúc JSON hoặc vượt quá dung lượng cho phép
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://campus.local/errors/validation"
            title: "Dữ liệu không hợp lệ"
            status: 400
            detail: "Kích thước chuỗi frameData vượt giới hạn cho phép (Tối đa 5MB)."
            instance: "/vision/detect"
            errors:
              - field: "frameData"
                code: "MAX_LENGTH_EXCEEDED"
                message: "Kích thước ảnh quá lớn"

    Unauthorized:
      description: Thiếu thông tin xác thực Bearer Token hoặc token không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://campus.local/errors/unauthorized"
            title: "Chưa xác thực"
            status: 401
            detail: "Thiếu Authorization header chứa hợp lệ Bearer JWT Token"
            instance: "/vision/detect"
            errors: []

    NotFound:
      description: Bản ghi hoặc tài nguyên yêu cầu không tồn tại trên hệ thống
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://campus.local/errors/not-found"
            title: "Không tìm thấy tài nguyên"
            status: 404
            detail: "Mã định danh dữ liệu không tồn tại trên hệ thống"
            instance: "/vision/detections/0196fb3d-4ad7-7d1e-9f49-5d5148d2babc"

    UnprocessableEntity:
      description: Sai sót logic nghiệp vụ mặc dù đúng định dạng cú pháp cấu trúc
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: Lỗi phát sinh ngoài ý muốn từ phía hệ thống máy chủ AI Vision
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          example: ai-vision-service
        time:
          type: string
          format: date-time
          example: '2026-05-27T08:00:00Z'

    DetectRequest:
      type: object
      additionalProperties: false
      required: [cameraId, timestamp, frameData]
      properties:
        cameraId:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^CAM-[A-Z0-9-]+$'
          description: Mã định danh duy nhất của camera phát hiện chuyển động.
          example: "CAM-LOBBY-01"
        correlationId:
          type: string
          minLength: 5
          maxLength: 100
          description: Mã liên kết dùng để theo vết log nghiệp vụ tránh trùng lặp request xử lý.
          example: "corr-123456789"
        timestamp:
          type: string
          format: date-time
          description: Thời gian bắt được frame hình ảnh từ phía thiết bị camera.
          example: "2026-05-27T08:15:00Z"
        frameData:
          type: string
          minLength: 10
          maxLength: 7000000
          description: Chuỗi nhị phân hình ảnh đã mã hóa về dạng văn bản Base64.
          example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="

    DetectResponse:
      type: object
      additionalProperties: false
      required: [detectionId, riskLevel, objects]
      properties:
        detectionId:
          type: string
          format: uuid
          description: Mã định danh kết quả nhận diện sinh ra bởi AI hệ thống.
          example: "0196fb3d-4ad7-7d1e-9f49-5d5148d2babc"
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: Mức độ rủi ro an ninh phân tích được tự động.
          example: "HIGH"
        objects:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/DetectedObject'

    DetectedObject:
      type: object
      required: [objectType, confidence]
      discriminator:
        propertyName: objectType
        mapping:
          HUMAN: '#/components/schemas/HumanObject'
          VEHICLE: '#/components/schemas/VehicleObject'
      properties:
        objectType:
          type: string
          enum: [HUMAN, VEHICLE]
          description: Trường định danh dùng cho việc ánh xạ đa hình (Polymorphism) phân loại thực thể.
          example: "HUMAN"
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Độ chính xác tin cậy dự đoán của thuật toán AI.
          example: 0.98

    HumanObject:
      allOf:
        - $ref: '#/components/schemas/DetectedObject'
        - type: object
          additionalProperties: false
          required: [actionDetected]
          properties:
            actionDetected:
              type: [string, 'null']
              maxLength: 100
              description: Hành vi bất thường nhận diện được, nhận giá trị null nếu không phát hiện nguy hiểm.
              example: "Intruding"

    VehicleObject:
      allOf:
        - $ref: '#/components/schemas/DetectedObject'
        - type: object
          additionalProperties: false
          required: [licensePlate]
          properties:
            licensePlate:
              type: [string, 'null']
              pattern: '^[0-9]{2}[A-Z]-[0-9]{4,5}$'
              description: Biển số xe quét được từ công cụ OCR, null nếu bị che khuất hoặc không rõ.
              example: "30A-12345"

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: "https://campus.local/errors/validation"
        title:
          type: string
          example: "Dữ liệu không hợp lệ"
        status:
          type: integer
          example: 400
        detail:
          type: [string, 'null']
          example: "Payload không đúng quy ước thiết kế JSON Schema"
        instance:
          type: [string, 'null']
          example: "/vision/detect"
        errors:
          type: array
          minItems: 0
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field:
                type: string
                example: "alertType"
              code:
                type: string
                example: "ENUM_MISMATCH"
              message:
                type: string
                example: "Giá trị không nằm trong danh sách enum cho phép"